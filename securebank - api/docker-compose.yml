version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: securebank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank_pass
      POSTGRES_DB: securebank_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securebank -d securebank_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securebank_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://securebank:securebank_pass@db:5432/securebank_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 1000
      AUTH_RATE_LIMIT_MAX: 100
      MAX_FAILED_LOGIN_ATTEMPTS: 50
      ACCOUNT_LOCK_DURATION_MINUTES: 30
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  db_test:
    image: postgres:16-alpine
    container_name: securebank_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank_pass
      POSTGRES_DB: securebank_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securebank -d securebank_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
